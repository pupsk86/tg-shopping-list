<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- THROWAWAY PROTOTYPE for #9 (adding Items). Delete once the variant is chosen. -->
<title>Adding Items</title>
<style>
  /* Layout: one phone-width Telegram List screen; a variant switch floats at the very bottom. */
  :root {
    --bg: #ffffff;
    --section: #f1f1f4;
    --text: #000000;
    --hint: #8e8e93;
    --separator: #c8c7cc;
    --link: #2481cc;
    --button: #2481cc;
    --button-text: #ffffff;
    --destructive: #ff3b30;
    --font: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --section: #1c1c1e; --text: #ffffff; --hint: #8d8d93; --separator: #38383a;
      --link: #3e88f7; --button: #3e88f7; --button-text: #ffffff; --destructive: #ff453a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --section: #1c1c1e; --text: #ffffff; --hint: #8d8d93; --separator: #38383a;
    --link: #3e88f7; --button: #3e88f7; --button-text: #ffffff; --destructive: #ff453a; color-scheme: dark;
  }
  body {
    margin: 0;
    background: var(--bg); color: var(--text); font: 17px/1.3 var(--font); -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 200px;
  }
  button, input { font: inherit; }
  button { -webkit-appearance: none; appearance: none; margin: 0; }
  .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .note { margin: 0; font-size: 13px; color: var(--hint); }
  .note strong { color: var(--text); font-weight: 600; }
  .back { align-self: flex-start; padding: 0; border: none; background: none; color: var(--link); cursor: pointer; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
  .section-header { margin: 0 0 -6px 16px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--hint); }
  .rows { list-style: none; margin: 0; padding: 0; border-radius: 12px; overflow: hidden; background: var(--section); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; }
  .row + .row { border-top: 0.5px solid var(--separator); }
  .check { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--hint); }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amount { color: var(--hint); font-variant-numeric: tabular-nums; }
  .row.new { animation: flash 0.9s ease; }
  @keyframes flash { from { background: color-mix(in srgb, var(--button) 25%, var(--section)); } }
  .empty { padding: 14px 16px; color: var(--hint); }
  .field { box-sizing: border-box; width: 100%; min-width: 0; border: none; border-radius: 12px; padding: 12px 16px; background: var(--section); color: var(--text); outline: none; }
  .field::placeholder { color: var(--hint); }
  .field:focus-visible, button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .error { min-height: 1.2em; margin: -6px 16px 0; font-size: 14px; color: var(--destructive); }
  .label { margin: 0 0 -8px 16px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--hint); }

  /* A: inline row */
  .add-row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; border: none; background: none; width: 100%; color: var(--link); cursor: pointer; text-align: left; }
  .add-row + .add-row, .rows .row + .add-row, .rows .row + .inline { border-top: 0.5px solid var(--separator); }
  .plus { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--link); color: var(--bg); display: grid; place-items: center; font-size: 18px; line-height: 1; }
  .inline { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 0 16px; }
  .inline .spacer { flex: none; width: 22px; }
  .inline input { border: none; background: none; color: var(--text); outline: none; padding: 10px 0; min-width: 0; }
  .inline .in-name { flex: 1; }
  .inline .in-amount { width: 64px; text-align: right; border-left: 0.5px solid var(--separator); padding-left: 8px; }
  .inline .add-btn { flex: none; width: 30px; height: 30px; border-radius: 50%; border: none; padding: 0; background: var(--button); color: var(--button-text); display: grid; place-items: center; cursor: pointer; }
  .inline .add-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }


  /* Telegram Main button stand-in */
  .main-button { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg);
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(64px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .main-button.over-keyboard { padding-bottom: 8px; }
  .main-button button { display: block; width: 100%; max-width: 480px; margin: 0 auto; border: none; border-radius: 10px; padding: 13px 20px; font-weight: 600; background: var(--button); color: var(--button-text); cursor: pointer; }

  .switch { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: var(--text); color: var(--bg); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .switch button { border: none; border-radius: 999px; width: 36px; height: 32px; background: transparent; color: var(--bg); cursor: pointer; font-size: 18px; }
  .switch span { padding: 0 8px; font: 600 13px var(--font); white-space: nowrap; }
  .log { margin: 0; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--hint); white-space: pre-wrap; overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { .row.new { animation: none; } }
</style>

</head>
<body>
<div class="app" id="app"></div>
<div id="bottom"></div>
<nav class="switch" aria-label="Variant">
  <button type="button" id="prev" aria-label="Previous variant">‹</button>
  <span id="variant-label"></span>
  <button type="button" id="next" aria-label="Next variant">›</button>
</nav>

<script>
  // PROTOTYPE for #9: three ways to add an Item to a Shopping List. In memory only.
  // Three versions of one idea: an inline add row at the end of the list. They differ only in where the add button is.
  const COMMON = 'Tap <strong>Add item</strong> at the end of the list and a row opens in place for the name and Amount. Return on the name also adds. After adding, the row clears for the next Item with the keyboard up. To cancel, tap outside an empty row, or tap Back.';
  const VARIANTS = {
    a: { key: 'A', name: 'Tick at the end', note: 'A blue tick at the <strong>end</strong> of the row adds the Item. ' + COMMON },
    b: { key: 'B', name: 'Tick at the start', note: 'A blue tick at the <strong>start</strong> of the row, where the plus was, adds the Item. ' + COMMON },
    c: { key: 'C', name: 'Telegram button', note: "Telegram's own bottom button reads <strong>Add</strong> while the row is open, sitting just above the keyboard. " + COMMON },
  };
  const ORDER = ['a', 'b', 'c'];
  const START = [
    { name: 'Milk', amount: null },
    { name: 'Apples', amount: 1.5 },
    { name: 'Eggs', amount: 10 },
  ];
  let items = START.map((i) => ({ ...i }));
  let variant = ORDER.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'a';
  let screen = 'list';
  let inlineOpen = false;
  let lastAction = 'Nothing yet.';
  let justAdded = -1;

  const app = document.getElementById('app');
  const bottom = document.getElementById('bottom');

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
  const fmt = (n) => String(n).replace('.', ',');

  // The rules from docs/01-app-design.md, roughly: names 1 to 100 characters; Amount above 0, up to 2 decimals.
  function parseName(raw) {
    const name = raw.trim();
    if (!name) return { error: 'Enter a name.' };
    if ([...name].length > 100) return { error: 'Use 100 characters or fewer.' };
    return { value: name };
  }
  function parseAmount(raw) {
    const text = raw.trim();
    if (!text) return { value: null };
    if (!/^\d+([.,]\d+)?$/.test(text)) return { error: 'Amount must be a number, like 2 or 1,5.' };
    const decimals = (text.split(/[.,]/)[1] || '').length;
    if (decimals > 2) return { error: 'Use up to 2 decimals.' };
    const n = Number(text.replace(',', '.'));
    if (!(n > 0)) return { error: 'Amount must be above 0.' };
    return { value: n };
  }
  function add(rawName, rawAmount) {
    const name = parseName(rawName);
    if (name.error) return name.error;
    const amount = parseAmount(rawAmount);
    if (amount.error) return amount.error;
    items.push({ name: name.value, amount: amount.value });
    justAdded = items.length - 1;
    lastAction = `Added "${name.value}"${amount.value === null ? '' : ` × ${fmt(amount.value)}`}.`;
    return null;
  }

  function rowsHtml() {
    return items.map((i, idx) => `
      <li class="row${idx === justAdded ? ' new' : ''}">
        <span class="check" aria-hidden="true"></span>
        <span class="name">${esc(i.name)}</span>
        ${i.amount === null ? '' : `<span class="amount">${fmt(i.amount)}</span>`}
      </li>`).join('');
  }
  function footer() {
    return `<p class="log">Last action: ${esc(lastAction)}\nTo buy: ${esc(items.map((i) => i.name + (i.amount === null ? '' : ' ' + fmt(i.amount))).join(', ') || 'nothing')}</p>
      <button type="button" class="back" id="reset" style="font-size:15px">Reset example Items</button>`;
  }
  function header() {
    return `<p class="note"><strong>${VARIANTS[variant].key} · ${VARIANTS[variant].name}.</strong> ${VARIANTS[variant].note}</p>
      <button type="button" class="back" id="list-back">‹ Back</button>
      <h1>Groceries</h1>
      <h2 class="section-header">To buy</h2>`;
  }

  function render() {
    document.getElementById('variant-label').textContent = `${VARIANTS[variant].key} · ${VARIANTS[variant].name}`;
    bottom.innerHTML = '';
    renderInline(variant);
    const reset = document.getElementById('reset');
    if (reset) reset.onclick = () => { items = START.map((i) => ({ ...i })); justAdded = -1; inlineOpen = false; lastAction = 'Reset.'; render(); };
    justAdded = -1;
  }

  const TICK = '<button type="button" class="add-btn" id="a-add" aria-label="Add item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>';

  function renderInline(v) {
    app.innerHTML = `${header()}
      <ul class="rows">${rowsHtml()}
        ${inlineOpen ? `<li class="inline">
            ${v === 'b' ? TICK : '<span class="spacer" aria-hidden="true"></span>'}
            <input class="in-name" id="a-name" placeholder="Item" enterkeyhint="done" aria-label="Item name" autocomplete="off">
            <input class="in-amount" id="a-amount" placeholder="Amount" inputmode="decimal" enterkeyhint="done" aria-label="Amount" autocomplete="off">
            ${v === 'a' ? TICK : ''}
          </li>` : `<li><button type="button" class="add-row" id="a-open"><span class="plus" aria-hidden="true">+</span>Add item</button></li>`}
      </ul>
      <p class="error" id="a-error" role="alert"></p>
      ${footer()}`;
    if (!inlineOpen) { document.getElementById('a-open').onclick = () => { inlineOpen = true; render(); }; return; }
    const nameEl = document.getElementById('a-name');
    const amountEl = document.getElementById('a-amount');
    const errorEl = document.getElementById('a-error');
    nameEl.focus();
    const submit = () => {
      const error = add(nameEl.value, amountEl.value);
      if (error) { errorEl.textContent = error; return; }
      render();
    };
    if (v === 'c') {
      bottom.innerHTML = `<div class="main-button" id="main-button"><button type="button" id="a-add">Add</button></div>`;
      placeAboveKeyboard();
    }
    const addBtn = document.getElementById('a-add');
    // Keep the keyboard up: the tap must not take focus away from the fields.
    addBtn.onpointerdown = (e) => e.preventDefault();
    addBtn.onclick = submit;
    const cancel = (why) => { inlineOpen = false; lastAction = why; render(); };
    // Telegram's Back button closes the open row first, instead of leaving the list.
    document.getElementById('list-back').onclick = () => cancel('Back closed the add row.');
    // Leaving an empty row (tapping elsewhere, or hiding the keyboard) cancels it.
    // A row with something typed stays open, so nothing typed is lost or added by accident.
    const row = nameEl.closest('.inline');
    row.addEventListener('focusout', () => {
      setTimeout(() => {
        if (!inlineOpen || row.contains(document.activeElement)) return;
        if (!nameEl.value.trim() && !amountEl.value.trim()) cancel('Tapped outside an empty row, so it closed.');
      }, 0);
    });
    nameEl.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); if (nameEl.value.trim()) submit(); else cancel('Return on an empty row closed it.'); } };
    amountEl.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
    [nameEl, amountEl].forEach((el) => { el.oninput = () => { errorEl.textContent = ''; }; });
  }

  // Telegram draws its bottom button just above the keyboard. A page can only imitate that by
  // following the visible part of the screen, which shrinks when the keyboard opens.
  function placeAboveKeyboard() {
    const el = document.getElementById('main-button');
    const vv = window.visualViewport;
    if (!el || !vv) return;
    const hidden = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    el.style.bottom = hidden + 'px';
    el.classList.toggle('over-keyboard', hidden > 0);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', placeAboveKeyboard);
    window.visualViewport.addEventListener('scroll', placeAboveKeyboard);
  }

  function go(step) {
    variant = ORDER[(ORDER.indexOf(variant) + step + ORDER.length) % ORDER.length];
    screen = 'list'; inlineOpen = false; lastAction = 'Nothing yet.';
    try { history.replaceState(null, '', '#' + variant); } catch (e) {}
    render();
  }
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('next').onclick = () => go(1);
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, [contenteditable]')) return;
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });
  render();
</script>
</body>
</html>
