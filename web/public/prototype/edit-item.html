<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- THROWAWAY PROTOTYPE for #12 (editing Items). Delete once the variant is chosen. -->
<title>Editing Items</title>
<style>
  /* Layout: one phone-width Telegram List screen; a variant switch floats at the very bottom. */
  :root {
    --bg: #ffffff;
    --section: #f1f1f4;
    --text: #000000;
    --hint: #8e8e93;
    --separator: #c8c7cc;
    --link: #2481cc;
    --button: #2481cc;
    --button-text: #ffffff;
    --destructive: #ff3b30;
    --font: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --section: #1c1c1e; --text: #ffffff; --hint: #8d8d93; --separator: #38383a;
      --link: #3e88f7; --button: #3e88f7; --button-text: #ffffff; --destructive: #ff453a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --section: #1c1c1e; --text: #ffffff; --hint: #8d8d93; --separator: #38383a;
    --link: #3e88f7; --button: #3e88f7; --button-text: #ffffff; --destructive: #ff453a; color-scheme: dark;
  }
  body {
    margin: 0;
    background: var(--bg); color: var(--text); font: 17px/1.3 var(--font); -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 200px;
  }
  button, input { font: inherit; }
  button { -webkit-appearance: none; appearance: none; margin: 0; }
  .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .note { margin: 0; font-size: 13px; color: var(--hint); }
  .note strong { color: var(--text); font-weight: 600; }
  .back { align-self: flex-start; padding: 0; border: none; background: none; color: var(--link); cursor: pointer; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .section-header { margin: 0 0 -6px 16px; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; color: var(--hint); }
  .rows { list-style: none; margin: 0; padding: 0; border-radius: 12px; overflow: hidden; background: var(--section); }
  .rows > li + li { border-top: 0.5px solid var(--separator); }
  .row { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; }
  .check { flex: none; box-sizing: border-box; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--hint); }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 11px 0; border: none; background: none; color: inherit; text-align: left; cursor: pointer; }
  .amount { color: var(--hint); font-variant-numeric: tabular-nums; }
  .row.flash { animation: flash 0.9s ease; }
  @keyframes flash { from { background: color-mix(in srgb, var(--button) 25%, var(--section)); } }
  .error { min-height: 1.2em; margin: -6px 16px 0; font-size: 14px; color: var(--destructive); }
  .log { margin: 0; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--hint); white-space: pre-wrap; overflow-wrap: anywhere; }

  /* A: inline */
  .inline { gap: 12px; padding: 0 8px 0 16px; }
  .inline input { border: none; background: none; color: var(--text); outline: none; padding: 10px 0; min-width: 0; }
  .inline .in-name { flex: 1; }
  .inline .in-amount { width: 72px; text-align: right; border-left: 0.5px solid var(--separator); padding-left: 8px; }
  .round { flex: none; display: grid; place-items: center; border: none; padding: 0; border-radius: 50%; cursor: pointer; }
  .round svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .round.save { width: 30px; height: 30px; background: var(--button); color: var(--button-text); }
  .round.save svg { width: 16px; height: 16px; stroke-width: 2.4; }
  .round.trash { width: 22px; height: 22px; background: var(--destructive); color: #fff; }
  .round.trash svg { width: 13px; height: 13px; stroke-width: 2.2; }

  /* A: swipe left for pencil and trash, as on Lists */
  .swipe { position: relative; overflow: hidden; }
  .swipe .content { position: relative; background: var(--section); touch-action: pan-y; user-select: none; -webkit-user-select: none; transition: transform .22s ease; }
  .swipe .content.dragging { transition: none; }
  .actions { position: absolute; inset: 0 0 0 auto; display: flex; width: 128px; }
  .swipe:not(.revealing) .actions { visibility: hidden; }
  .actions button { flex: 1; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; border: none; border-radius: 0; color: #fff; cursor: pointer; }
  .actions .edit { background: #8e8e93; }
  .actions .delete { background: var(--destructive); }
  .actions svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* B and C: form fields */
  .label { margin: 0 0 -8px 16px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--hint); }
  .field { box-sizing: border-box; width: 100%; border: none; border-radius: 12px; padding: 12px 16px; background: var(--section); color: var(--text); outline: none; }
  .field::placeholder { color: var(--hint); }
  .delete-row { box-sizing: border-box; width: 100%; border: none; border-radius: 12px; padding: 12px 16px; background: var(--section); color: var(--destructive); text-align: left; cursor: pointer; }

  /* C: sheet */
  .scrim { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.35); animation: fade .2s ease; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; box-sizing: border-box; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 14px; padding: 8px 16px calc(80px + env(safe-area-inset-bottom, 0px));
    border-radius: 14px 14px 0 0; background: var(--bg); animation: up .22s ease; }
  .grabber { align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--separator); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .link { border: none; background: none; padding: 0; color: var(--link); cursor: pointer; }
  .link.strong { font-weight: 600; }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }

  .main-button { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg);
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(64px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .main-button button { display: block; width: 100%; max-width: 480px; margin: 0 auto; border: none; border-radius: 10px; padding: 13px 20px; font-weight: 600; background: var(--button); color: var(--button-text); cursor: pointer; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 15;
    box-sizing: border-box; width: min(448px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-radius: 12px; background: #2c2c2e; color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.25); animation: fade .2s ease; }
  .toast span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button { border: none; background: none; padding: 0; color: #64d2ff; font-weight: 600; cursor: pointer; }

  .switch { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: var(--text); color: var(--bg); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .switch button { border: none; border-radius: 999px; width: 36px; height: 32px; background: transparent; color: var(--bg); cursor: pointer; font-size: 18px; }
  .switch span { padding: 0 8px; font: 600 13px var(--font); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .row.flash, .sheet, .scrim, .toast { animation: none; } }
</style>

</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div id="toast-slot"></div>
<nav class="switch" aria-label="Variant">
  <button type="button" id="prev" aria-label="Previous variant">‹</button>
  <span id="variant-label"></span>
  <button type="button" id="next" aria-label="Next variant">›</button>
</nav>

<script>
  // PROTOTYPE for #12: three ways to edit or delete an Item. In memory only.
  const COMMON = 'Tap an Item\'s <strong>name</strong> to edit it. Delete is immediate, with an <strong>Undo</strong> toast for 5 seconds. Back leaves without saving.';
  const VARIANTS = {
    a: { key: 'A', name: 'Edit in the row', note: '<strong>Swipe an Item left</strong> for a pencil and a trash, as on Lists; the trash deletes straight away. The pencil, or tapping the name, turns the row into fields like the add row: the blue tick saves, the red trash at the start deletes. Return saves; tapping outside leaves it unchanged. ' + COMMON },
    b: { key: 'B', name: 'Edit screen', note: 'A screen of its own with the name and Amount, Telegram\'s bottom button reading <strong>Save</strong>, and a red <strong>Delete item</strong> row. ' + COMMON },
    c: { key: 'C', name: 'Sheet', note: 'A sheet slides up over the list with the name and Amount, <strong>Save</strong> at the top right and <strong>Delete item</strong> below. Tapping the dimmed list closes it. ' + COMMON },
  };
  const ORDER = ['a', 'b', 'c'];
  const START = [
    { id: 1, name: 'Milk', amount: null },
    { id: 2, name: 'Bread', amount: 2 },
    { id: 3, name: 'Eggs', amount: 10 },
    { id: 4, name: 'Apples', amount: 1.5 },
  ];
  let items = START.map((i) => ({ ...i, deleted: false }));
  let variant = ORDER.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'a';
  let editing = null; // id of the Item being edited
  let flash = null;
  let lastAction = 'Nothing yet.';
  let toast = null; // { id, timer }

  const app = document.getElementById('app');
  const layer = document.getElementById('layer');
  const toastSlot = document.getElementById('toast-slot');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const fmt = (n) => String(n).replace('.', ',');
  const TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const PENCIL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
  const BIG_TRASH = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>';
  const SWIPE_WIDTH = 128;
  const TRASH = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13"/></svg>';

  // The same rules the app uses when adding.
  function parse(rawName, rawAmount) {
    const name = rawName.trim();
    if (!name) return { error: 'Enter a name.' };
    if ([...name].length > 100) return { error: 'Use 100 characters or fewer.' };
    const text = rawAmount.trim();
    if (!text) return { name, amount: null };
    const m = /^(-?)(\d+)(?:[.,](\d+))?$/.exec(text);
    if (!m) return { error: 'Amount must be a number, like 2 or 1,5.' };
    if ((m[3] || '').length > 2) return { error: 'Use up to 2 decimals in the Amount.' };
    const n = Number(m[2] + '.' + (m[3] || '0'));
    if (m[1] || n === 0) return { error: 'Amount must be above 0.' };
    return { name, amount: n };
  }
  const item = (id) => items.find((i) => i.id === id);
  const label = (i) => i.name + (i.amount === null ? '' : ' ' + fmt(i.amount));

  function save(rawName, rawAmount) {
    const r = parse(rawName, rawAmount);
    if (r.error) return r.error;
    const it = item(editing);
    it.name = r.name; it.amount = r.amount;
    lastAction = `Saved "${label(it)}".`;
    flash = it.id; editing = null; render();
    return null;
  }
  function cancel(why) { editing = null; lastAction = why; render(); }
  function remove(id = editing) {
    const it = item(id);
    it.deleted = true; editing = null;
    lastAction = `Deleted "${it.name}".`;
    showToast(it.id);
    render();
  }
  function showToast(id) {
    if (toast) clearTimeout(toast.timer);
    toast = { id, timer: setTimeout(() => { toast = null; renderToast(); }, 5000) };
    renderToast();
  }
  function renderToast() {
    if (!toast) { toastSlot.innerHTML = ''; return; }
    toastSlot.innerHTML = `<div class="toast" role="status"><span>Deleted “${esc(item(toast.id).name)}”</span><button type="button" id="undo">Undo</button></div>`;
    document.getElementById('undo').onclick = () => {
      const it = item(toast.id);
      it.deleted = false; flash = it.id; lastAction = `Undo brought back "${it.name}" in its place.`;
      clearTimeout(toast.timer); toast = null; renderToast(); render();
    };
  }

  function rowHtml(i) {
    if (variant === 'a' && editing === i.id) {
      return `<li class="row inline" id="edit-row">
        <button type="button" class="round trash" id="e-delete" aria-label="Delete ${esc(i.name)}">${TRASH}</button>
        <input class="in-name" id="e-name" value="${esc(i.name)}" aria-label="Item name" enterkeyhint="done" autocomplete="off">
        <input class="in-amount" id="e-amount" value="${i.amount === null ? '' : fmt(i.amount)}" placeholder="Amount" aria-label="Amount" inputmode="decimal" enterkeyhint="done" autocomplete="off">
        <button type="button" class="round save" id="e-save" aria-label="Save">${TICK}</button>
      </li>`;
    }
    const content = `<span class="check" aria-hidden="true"></span>
      <button type="button" class="name" data-id="${i.id}">${esc(i.name)}</button>
      ${i.amount === null ? '' : `<span class="amount">${fmt(i.amount)}</span>`}`;
    if (variant === 'a') {
      return `<li class="swipe" data-id="${i.id}">
        <div class="actions" aria-hidden="true">
          <button type="button" class="edit" data-act="edit" tabindex="-1" aria-label="Edit ${esc(i.name)}">${PENCIL}</button>
          <button type="button" class="delete" data-act="delete" tabindex="-1" aria-label="Delete ${esc(i.name)}">${BIG_TRASH}</button>
        </div>
        <div class="row content${flash === i.id ? ' flash' : ''}">${content}</div>
      </li>`;
    }
    return `<li class="row${flash === i.id ? ' flash' : ''}">${content}</li>`;
  }
  function footer() {
    const live = items.filter((i) => !i.deleted);
    return `<p class="log">Last action: ${esc(lastAction)}\nTo buy: ${esc(live.map(label).join(', ') || 'nothing')}</p>
      <button type="button" class="link" id="reset" style="align-self:flex-start">Reset example Items</button>`;
  }
  function listHtml() {
    return `<p class="note"><strong>${VARIANTS[variant].key} · ${VARIANTS[variant].name}.</strong> ${VARIANTS[variant].note}</p>
      <button type="button" class="back" id="back">‹ Back</button>
      <h1>Groceries</h1>
      <h2 class="section-header">To buy</h2>
      <ul class="rows">${items.filter((i) => !i.deleted).map(rowHtml).join('')}</ul>
      <p class="error" id="e-error" role="alert"></p>
      ${footer()}`;
  }

  function wireFields(nameEl, amountEl, errorEl) {
    const submit = () => { const e = save(nameEl.value, amountEl.value); if (e) errorEl.textContent = e; };
    [nameEl, amountEl].forEach((el) => {
      el.oninput = () => { errorEl.textContent = ''; };
      el.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
    });
    return submit;
  }

  function render() {
    openRow = null;
    document.getElementById('variant-label').textContent = `${VARIANTS[variant].key} · ${VARIANTS[variant].name}`;
    layer.innerHTML = '';
    if (variant === 'b' && editing !== null) renderScreen();
    else {
      app.innerHTML = listHtml();
      document.getElementById('back').onclick = () => { if (editing !== null) cancel('Back closed the edit without saving.'); else lastAction = 'Back would return to Lists.'; render(); };
      app.querySelectorAll('.name').forEach((b) => { b.onclick = () => { editing = Number(b.dataset.id); flash = null; render(); }; });
      if (variant === 'a') app.querySelectorAll('.swipe').forEach(wireSwipe);
      if (variant === 'a' && editing !== null) wireInline();
      if (variant === 'c' && editing !== null) renderSheet();
    }
    document.getElementById('reset').onclick = () => { items = START.map((i) => ({ ...i, deleted: false })); editing = null; lastAction = 'Reset.'; render(); };
    flash = null;
  }

  function wireInline() {
    const row = document.getElementById('edit-row');
    const nameEl = document.getElementById('e-name');
    const amountEl = document.getElementById('e-amount');
    const submit = wireFields(nameEl, amountEl, document.getElementById('e-error'));
    nameEl.focus(); nameEl.setSelectionRange(nameEl.value.length, nameEl.value.length);
    // Tapping these must not take focus from the fields.
    ['e-save', 'e-delete'].forEach((id) => { document.getElementById(id).onpointerdown = (e) => e.preventDefault(); });
    document.getElementById('e-save').onclick = submit;
    document.getElementById('e-delete').onclick = () => remove();
    row.addEventListener('focusout', () => setTimeout(() => {
      if (editing === null || row.contains(document.activeElement)) return;
      cancel('Tapped outside, so the edit closed without saving.');
    }, 0));
  }

  // Swipe left to show the pencil and trash; one row open at a time; a tap elsewhere closes it.
  let openRow = null;
  let swiped = false; // the click that ends a swipe must not open the edit
  function wireSwipe(row) {
    const id = Number(row.dataset.id);
    const content = row.querySelector('.content');
    row.querySelectorAll('.actions button').forEach((b) => {
      b.onclick = () => {
        openRow = null;
        if (b.dataset.act === 'delete') remove(id);
        else { editing = id; render(); }
      };
    });
    content.querySelector('.name').addEventListener('click', (e) => {
      if (swiped) { e.stopImmediatePropagation(); swiped = false; }
    }, true);
    let startX = 0, startY = 0, base = 0, dx = 0, tracking = false, decided = false, horizontal = false;
    const setX = (x) => { content.style.transform = `translateX(${x}px)`; };
    content.addEventListener('pointerdown', (e) => {
      tracking = true; decided = false; horizontal = false;
      startX = e.clientX; startY = e.clientY; dx = 0;
      base = openRow === row ? -SWIPE_WIDTH : 0;
    });
    content.addEventListener('pointermove', (e) => {
      if (!tracking) return;
      const mx = e.clientX - startX, my = e.clientY - startY;
      if (!decided && (Math.abs(mx) > 6 || Math.abs(my) > 6)) {
        decided = true; horizontal = Math.abs(mx) > Math.abs(my);
        if (horizontal) { content.setPointerCapture(e.pointerId); content.classList.add('dragging'); row.classList.add('revealing'); }
      }
      if (!horizontal) return;
      dx = mx;
      let x = base + dx;
      if (x > 0) x = x / 4;
      if (x < -SWIPE_WIDTH) x = -SWIPE_WIDTH + (x + SWIPE_WIDTH) / 4;
      setX(x);
    });
    const end = () => {
      if (!tracking) return;
      tracking = false;
      content.classList.remove('dragging');
      if (!horizontal) {
        if (openRow === row) { closeOpenRow(); swiped = true; }
        return;
      }
      swiped = true;
      const opened = base + dx < -SWIPE_WIDTH / 2;
      setX(opened ? -SWIPE_WIDTH : 0);
      if (opened) {
        openRow = row;
        row.querySelectorAll('.actions button').forEach((b) => { b.tabIndex = 0; });
        row.querySelector('.actions').setAttribute('aria-hidden', 'false');
        lastAction = `Swiped "${item(id).name}" open.`;
        document.querySelector('.log').textContent = document.querySelector('.log').textContent.replace(/^Last action: .*/, 'Last action: ' + lastAction);
      } else {
        if (openRow === row) openRow = null;
        hideActions(row);
      }
    };
    content.addEventListener('pointerup', end);
    content.addEventListener('pointercancel', end);
  }
  function hideActions(row) { setTimeout(() => { if (openRow !== row) row.classList.remove('revealing'); }, 250); }
  function closeOpenRow() {
    if (!openRow) return;
    const row = openRow;
    openRow = null;
    row.querySelector('.content').style.transform = 'translateX(0)';
    row.querySelectorAll('.actions button').forEach((b) => { b.tabIndex = -1; });
    row.querySelector('.actions').setAttribute('aria-hidden', 'true');
    hideActions(row);
  }
  document.addEventListener('pointerdown', (e) => {
    swiped = false;
    if (openRow && !openRow.contains(e.target)) { closeOpenRow(); swiped = true; }
  }, true);

  function formHtml() {
    const it = item(editing);
    return `<label class="label" for="e-name">Item name</label>
      <input class="field" id="e-name" value="${esc(it.name)}" enterkeyhint="done" autocomplete="off">
      <label class="label" for="e-amount">Amount</label>
      <input class="field" id="e-amount" value="${it.amount === null ? '' : fmt(it.amount)}" placeholder="Optional, like 2 or 1,5" inputmode="decimal" enterkeyhint="done" autocomplete="off">
      <p class="error" id="e-error" role="alert"></p>
      <button type="button" class="delete-row" id="e-delete">Delete item</button>`;
  }

  function renderScreen() {
    app.innerHTML = `<p class="note"><strong>${VARIANTS.b.key} · ${VARIANTS.b.name}.</strong> ${VARIANTS.b.note}</p>
      <button type="button" class="back" id="back">‹ Back</button>
      <h1>Edit item</h1>
      ${formHtml()}
      ${footer()}`;
    layer.innerHTML = '<div class="main-button"><button type="button" id="e-save">Save</button></div>';
    const submit = wireFields(document.getElementById('e-name'), document.getElementById('e-amount'), document.getElementById('e-error'));
    document.getElementById('e-save').onclick = submit;
    document.getElementById('e-delete').onclick = () => remove();
    document.getElementById('back').onclick = () => cancel('Back left the edit screen without saving.');
  }

  function renderSheet() {
    layer.innerHTML = `<div class="scrim" id="scrim"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-head">
          <button type="button" class="link" id="e-cancel">Cancel</button>
          <h2 id="sheet-title">Edit item</h2>
          <button type="button" class="link strong" id="e-save">Save</button>
        </div>
        ${formHtml()}
      </div>`;
    const submit = wireFields(document.getElementById('e-name'), document.getElementById('e-amount'), document.getElementById('e-error'));
    document.getElementById('e-save').onclick = submit;
    document.getElementById('e-delete').onclick = () => remove();
    document.getElementById('e-cancel').onclick = () => cancel('Cancel closed the sheet without saving.');
    document.getElementById('scrim').onclick = () => cancel('Tapping the list closed the sheet without saving.');
  }

  function go(step) {
    variant = ORDER[(ORDER.indexOf(variant) + step + ORDER.length) % ORDER.length];
    editing = null; lastAction = 'Nothing yet.';
    try { history.replaceState(null, '', '#' + variant); } catch (e) {}
    render();
  }
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('next').onclick = () => go(1);
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, [contenteditable]')) return;
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });
  render();
</script>
</body>
</html>
